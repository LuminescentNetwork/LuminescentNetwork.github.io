<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxeliaForge</title>

  <style>
:root { 
    --primary-purple: #a855f7;
    --dark-purple: #7c3aed;
    --light-purple: #c084fc;
    --neon-purple: #d946ef;
    --darker-bg: #0f0117;
    --dark-bg: #1a0033;
    --text-primary: #e0e0ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: #0f0117;
    color: white;
}

.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(15,1,23,0.95);
    padding: 10px;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-logo img {
    width: 35px;
    height: 35px;
}

.nav-menu {
    display: flex;
    gap: 20px;
    list-style: none;
}

.nav-link {
    color: white;
    text-decoration: none;
}

.hero {
    margin-top: 100px;
    text-align: center;
}

.glowing-text {
    font-size: 3rem;
    color: var(--neon-purple);
}

.cta-button {
    margin-top: 20px;
    padding: 1rem 2rem;
    background: var(--neon-purple);
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 10px;
}
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    
    <div class="nav-logo">
      <img src="logo.png" alt="VoxeliaForge Logo">
    </div>

    <ul class="nav-menu">
      <li><a class="nav-link" href="#features">Features</a></li>
      <li><a class="nav-link" href="#screens">Screens</a></li>
      <li><a class="nav-link" href="#download">Download</a></li>
      <li><a class="nav-link" href="#kids">Kids</a></li>
    </ul>

  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1 class="glowing-text">VoxeliaForge</h1>
  <p>Next-gen chat & community platform</p>
  <button class="cta-button">Download Now</button>
</section>

</body>
</html>
